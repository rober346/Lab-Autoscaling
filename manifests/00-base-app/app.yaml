# App base — el punto de partida del lab, ANTES de cualquier autoscaling.
# Réplicas fijas, escaladas MANUALMENTE (cambiando 'replicas' a mano).
# Sirve de referencia para comparar contra el escalado automático de fases posteriores.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 3   # <- fijo, manual. Para "escalar" esto, hay que editar este número a mano.
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: nginx:1.27-alpine   # nota: en la versión original se usó nginx:1.14.2 (desactualizada)
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  selector:
    app: hello
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  number: 80
